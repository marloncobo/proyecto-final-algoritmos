<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --bg: #f9f9f9;
            --text: #333;
            --white: #fff;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent; /* fondo transparente para que se vea el video */
            color: var(--text);
            height: 100vh;
            overflow-x: hidden;
            position: relative;
            z-index: 0;
        }
        header {
            background-color: var(--primary);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            position: relative;
            z-index: 10; /* Por encima del video */
        }
        header img {
            height: 50px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #dfffdc;
        }
        .registro {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background: transparent; /* fondo transparente para que se vea el video */
        }
        .container {
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.3); /* fondo blanco con 30% de opacidad */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 0;
            color: #222;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 15px;
            font-weight: 600;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 5px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
    </style>
</head>
<body>
    <header>
        <img src="img/logo.jpg" alt="Logo Veterinaria">
        <nav>
        <ul>
            <li><a href="proyectofinal_1.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="equipo.html">Equipo</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="registro.html">Registro</a></li>
        </ul>
        </nav>
    </header>
    <section class="registro">
        <div class="container">
            <h3>Solicita tu cita</h3>
            <form action="http://localhost:3000/api/desparasitacion" method="post">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="mascota">Nombre de la mascota:</label>
                <input type="text" id="mascota" name="mascota" required>

                <label for="tipo">Tipo de mascota:</label>
                <select id="tipo" name="tipo">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
                <option value="otro">Otro</option>
                

                <label for="mensaje">Comentarios adicionales:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Agrega un comentario"></textarea>

                <label for="fecha">Fecha de la cita:</label>
                <input type="datetime-local" id="fecha" name="fecha_desparasitacion" required>

                <input type="submit" value="Enviar solicitud">
            </form>
        </div>
    </section>
</body>
</html>
