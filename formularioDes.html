<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta</title>
  <style>
    :root {
      --primary: #01879e;
      --primary-dark: #01879e;
      --bg: #f9f9f9;
      --text: #333;
      --white: #fff;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    video.bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.5);
    }

    header {
      background-color: var(--primary);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    header img {
      height: 50px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #dfffdc;
    }

    .registro {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.3);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    h3 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 15px;
      font-weight: 600;
    }

    input, select, textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 5px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="submit"] {
      margin-top: 20px;
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <!-- 🎥 VIDEO DE FONDO -->
  <video autoplay muted loop class="bg-video">
    <source src="video/perros.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>

  <!-- 🔝 BARRA DE NAVEGACIÓN -->
  <header>
    <img src="img/logo.jpg" alt="Logo Veterinaria" />
    <nav>
      <ul>
        <li><a href="inicio.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="equipo.html">Equipo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <!-- 📝 FORMULARIO -->
  <section class="registro">
    <div class="container">
      <h3>Solicita tu cita</h3>
      <form action="http://localhost:3000/api/desparasitacion" method="post">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required />

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required />

        <label for="mascota">Nombre de la mascota:</label>
        <input type="text" id="mascota" name="mascota" required />

        <label for="tipo">Tipo de mascota:</label>
        <select id="tipo" name="tipo">
          <option value="perro">Perro</option>
          <option value="gato">Gato</option>
          <option value="otro">Otro</option>
        </select>

        <label for="mensaje">Comentarios adicionales:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Agrega un comentario"></textarea>

        <input type="submit" value="Enviar solicitud" />
      </form>
    </div>
  </section>

  <script src="/js/desparacitarDes.js"></script>
</body>
</html>
